name: Build and test LicentieKluis
on:
  workflow_dispatch:
  push:
    branches: [main, 'web/**']
jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build native client and run tests
        shell: pwsh
        run: ./scripts/Build-Rust.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LicentieKluis-Rust-Windows
          path: |
            output/Windows-Rust/
            Cargo.lock
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/LicenseVault.Tests.csproj -c Release
      - run: dotnet publish Server/LicenseVault.Server.csproj -c Release --self-contained false -p:UseAppHost=false -o output/Server
      - run: node Tests/web.test.cjs
      - run: node Tests/mail.test.cjs
      - run: node Tests/vault.test.cjs
      - run: python3 Tests/server-web.test.py
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/lkv-browser --no-package-lock playwright@1.62.1
          node /tmp/lkv-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser management regression tests
        run: NODE_PATH=/tmp/lkv-browser/node_modules node Tests/manage.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LicentieKluis-Web-UI-tests
          path: /tmp/licentiekluis-web-*.png
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python3 Tests/upgrade.test.py
      - run: python3 Tests/proxmox.test.py
      - run: python3 Tests/server-init.test.py
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S error scripts/*.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LicentieKluis-Server
          path: output/Server/


